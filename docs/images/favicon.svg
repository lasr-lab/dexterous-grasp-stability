<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">A black robot hand holding a red cube, with a partly occluded thumb and cyan fingertips curling onto the side faces</title>
  <defs>
    <path id="fingertip" d="M-3.5-3H3.5V0A3.5 3.5 0 0 1-3.5 0Z"/>
  </defs>
  <rect width="64" height="64" rx="12" fill="#fff"/>
  <g transform="translate(-2 0)">
    <g id="far-finger">
      <path d="M41 18 53 20 59 29 59 34 55 40" fill="none" stroke="#20252a" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
      <use href="#fingertip" fill="#67d8ed" transform="translate(55 40) rotate(33.690068)"/>
    </g>
    <g id="thumb">
      <path d="M24 17 15 24 12 34 14 41 18 46H23.5" fill="none" stroke="#20252a" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
      <use href="#fingertip" fill="#67d8ed" transform="translate(23.5 46) rotate(-90)"/>
    </g>
    <g id="cube">
      <path d="M25 36 31 32H54L48 36Z" fill="#ef8174"/>
      <path d="M25 36H48V59H25Z" fill="#d85b55"/>
      <path d="M48 36 54 32V55L48 59Z" fill="#b54140"/>
    </g>
    <g id="middle-finger">
      <path d="M40 17 53 24 58 33 58 37 54 43" fill="none" stroke="#20252a" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
      <use href="#fingertip" fill="#67d8ed" transform="translate(54 43) rotate(33.690068)"/>
    </g>
    <g id="index-finger">
      <path d="M35 19 46 25 50 33 48 38 42 44" fill="none" stroke="#20252a" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
      <use href="#fingertip" fill="#67d8ed" transform="translate(42 44) rotate(45)"/>
    </g>
    <path d="M2 10H34L45 15V22H2Z" fill="#20252a"/>
  </g>
</svg>
